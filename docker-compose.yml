version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    container_name: claude-proxy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: claudeproxy
      POSTGRES_USER: claudeproxy
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-claudeproxy}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeproxy"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Kotlin service: management API + datapath + control API. Reachable only on the compose
  # network (nginx fronts it); no host port. DNS alias on the network is the service key: `service`.
  service:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
    image: claude-proxy:latest
    # Renamed from `claude-proxy` so the new container can run alongside the old one during a
    # zero-downtime cutover (old `claude-proxy` keeps serving :8787 until host-nginx flips).
    container_name: claude-proxy-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    env_file: .env
    environment:
      # Bind to all interfaces INSIDE the container so nginx can reach it over the network.
      BIND_HOST: "0.0.0.0"
      # Public domain — sets publicBaseUrl (token base URL) and the CORS allowHost for the
      # Vite dev origin. The SPA is same-origin in prod (served by nginx), so CORS is moot there.
      # Comes from .env (PUBLIC_DOMAIN=proxy.example.com); blank => the UI falls back to the
      # browser's current origin.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/claudeproxy
      DATABASE_USER: claudeproxy
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-claudeproxy}
      # Shared secret gating the private /internal/* control API (also set on the gateway).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Gateway: the whole Go data plane in one image and one container. The Claude Code datapath and
  # both API routing gateways are one codebase, so they are now one process on one port, split by
  # path (see gateway/main.go): /v1/… is the datapath, /routing/openai/… and /routing/anthropic/…
  # are the routing gateways. Thin — resolves each request against the service's /internal/*
  # control API, forwards to Anthropic, relays SSE, reports usage back. Never touches Postgres.
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: claude-proxy-gateway:latest
    container_name: claude-proxy-gateway
    restart: unless-stopped
    depends_on:
      service:
        condition: service_healthy
    expose:
      - "9000"
    environment:
      PORT: "9000"
      SERVICE_URL: "http://service:8787"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      UPSTREAM_BASE_URL: "https://api.anthropic.com"
      ANTHROPIC_PROXY_URL: ${ANTHROPIC_PROXY_URL:-}
      # How long an open stream may go without a single upstream byte before the relay gives up
      # on it (0 disables). Our keep-alives make a dead upstream look alive, so without this a
      # stream that dies mid-answer hangs until the user gives up.
      UPSTREAM_STALL_SECONDS: ${UPSTREAM_STALL_SECONDS:-120}
      # How long a streaming request may wait for Anthropic's response head before we open the
      # client's stream ourselves and keep it warm with keep-alives (0 disables). Until the head
      # is out the client sees zero bytes, and a CDN in front counts that silence — Cloudflare
      # cuts the request off at 120s with a 524.
      EARLY_HEAD_SECONDS: ${EARLY_HEAD_SECONDS:-45}
      # Claude model for unmapped OpenAI model names (see gateway/internal/openaigw).
      DEFAULT_MODEL: "claude-sonnet-5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Front: serves the React SPA static build (nginx). Internal only — the edge router forwards
  # `/` here. No API/datapath knowledge; rebuilt whenever the UI changes.
  front:
    build:
      context: .
      dockerfile: deploy/Dockerfile.front
    image: claude-proxy-front:latest
    container_name: claude-proxy-front
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Edge router: fans one origin out to front (SPA), service (/api), and the datapath
  # (/gateway,/v1). Published on localhost:8080 — host nginx + Cloudflare proxy here (TLS at host).
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    image: claude-proxy-nginx:latest
    container_name: claude-proxy-nginx
    restart: unless-stopped
    # service + front gate startup (SPA + /api + control plane must be up). The Go gateway only
    # needs to be STARTED (so its DNS name resolves for proxy_pass) — NOT healthy: a broken data
    # plane must degrade to a 502 on its own routes, never block the whole edge router (and never
    # block the datapath rollback, which just reverts the /gateway,/v1 proxy_pass to service:8787).
    # nginx re-resolves upstreams on restart if a container's IP changes.
    depends_on:
      service:
        condition: service_healthy
      front:
        condition: service_healthy
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
