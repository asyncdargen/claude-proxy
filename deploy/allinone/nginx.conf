# Main nginx config of the all-in-one image. The server block is the same template the web image
# uses (rendered by the entrypoint into conf.d/default.conf); this file only supplies what the
# official nginx image would: workers, mime types, logs to the container's stdout/stderr.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
