# SSE-safe proxy settings for the Anthropic datapath. LOAD-BEARING — do not weaken.
# With buffering on, nginx withholds the response head until the first body bytes; during
# Opus "thinking" (30s+ of upstream silence) the client aborts → "upstream prematurely
# closed connection" (502) + an endless client retry loop. See docs/ARCHITECTURE.md.
include /etc/nginx/proxy_common.conf;
proxy_buffering off;            # stream the head + each SSE event through immediately
proxy_request_buffering off;    # don't buffer the (possibly large) request body
proxy_read_timeout 3600s;       # upstream can stream for minutes after a long silence
proxy_send_timeout 3600s;
chunked_transfer_encoding on;
